<!doctype html>
<html lang="nl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Wouter's aandelenscreener</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--bg2:#f1f3f5;--tx:#111827;--mut:#6b7280;--b:#e5e7eb;--b2:#cbd5e1;--p:#0b5ed7;--up:#15803d;--dn:#dc2626}
@media (prefers-color-scheme:dark){:root{--bg:#101318;--bg2:#1c2128;--tx:#e5e7eb;--mut:#9ca3af;--b:#2a2f38;--b2:#3b424d;--p:#2f6fdc;--up:#4ade80;--dn:#f87171}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,sans-serif}
#ph{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.hd{background:var(--p);color:#fff;padding:13px 16px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:5}
.hd .t{flex:1;font-size:17px;font-weight:600}
.ib{font-size:21px;cursor:pointer;line-height:1;user-select:none}
.body{padding:12px 12px 16px;flex:1}
button{font:inherit;padding:8px 12px;border:0;border-radius:8px;background:var(--p);color:#fff;cursor:pointer}
button.sm{font-size:12.5px;padding:5px 10px}
button.ghost{background:transparent;color:var(--tx);border:1px solid var(--b2)}
input[type=text],input[type=url],select{font:inherit;padding:9px;border:1px solid var(--b2);border-radius:8px;background:transparent;color:var(--tx);min-width:0}
.seg{display:flex;gap:4px}
.seg button{font-size:12px;padding:4px 9px;background:transparent;color:var(--tx);border:1px solid var(--b2)}
.seg button.on,.top button.on{background:var(--p);color:#fff;border-color:var(--p)}
.top{display:flex;gap:6px;margin-bottom:8px}
.top button{flex:1;font-size:13px;padding:7px 4px;background:transparent;color:var(--tx);border:1px solid var(--b2)}
.r{display:grid;grid-template-columns:minmax(0,1fr) 46px 62px 62px 56px;gap:4px;padding:9px 2px;border-bottom:1px solid var(--b);font-size:11.5px;align-items:center}
.nv .r{grid-template-columns:minmax(0,1fr) 50px 66px 66px}
.r>div+div{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.nv .wv{display:none}
.n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.n a{color:var(--tx);text-decoration:none;border-bottom:1px dotted var(--b2)}
.gh{background:var(--bg2);font-weight:600;cursor:pointer;border-radius:6px;padding-left:6px;padding-right:6px;margin-top:4px}
.gh small{font-weight:400;color:var(--mut)}
.up{color:var(--up)}.dn{color:var(--dn)}
.m,small,.lbl{color:var(--mut)}
.lbl{font-size:12px}
.sec{font-size:13px;font-weight:600;margin:18px 0 6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec .sub{font-size:11px;color:var(--mut);font-weight:400}
.ln{display:flex;justify-content:space-between;gap:10px;padding:8px 2px;border-bottom:1px solid var(--b);font-size:13px}
.ln.gap{margin-top:14px}
.ln .v{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ln small{display:block;font-size:11px;margin-top:2px;white-space:normal}
.gn{display:grid;gap:4px;padding:8px 2px;border-bottom:1px solid var(--b);font-size:11.5px;align-items:center}
.gn>div+div{text-align:right;font-variant-numeric:tabular-nums}
.gn.gap{margin-top:14px}
.big{text-align:center;padding:4px 0 8px}
.big .x{font-size:28px;font-weight:600;line-height:1.3}
.dv{display:grid;grid-template-columns:122px 1fr 62px;gap:8px;align-items:center;padding:3px 0;font-size:11.5px}
.dv .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dv .ar{position:relative;height:12px}
.dv .ar:before{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--b2)}
.dv .bar{position:absolute;top:1px;height:10px;border-radius:2px}
.dv .vl{text-align:right;font-variant-numeric:tabular-nums;font-size:11px}
.bu{background:var(--up)}.bd{background:var(--dn)}
.pg{margin:8px 0 12px}
.pg .tp{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
.pg .tk{position:relative;height:12px;background:var(--bg2);border-radius:6px}
.pg .fl{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--p)}
.pg .mk{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--tx)}
.cb{background:var(--bg2);border-radius:10px;padding:8px 10px;margin-bottom:10px}
.ch{font-size:13px;font-weight:600;margin-bottom:4px}
.lb{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin:8px 0 2px}
.t3{display:grid;grid-template-columns:minmax(0,1fr) 54px 76px;gap:6px;padding:4px 0;font-size:12px;border-bottom:1px solid var(--b)}

.t3>div+div{text-align:right;font-variant-numeric:tabular-nums}
.t3.tt{font-weight:600;border-bottom:none;border-top:1px solid var(--b2);margin-top:6px;padding-top:7px}
.sp{display:grid;grid-template-columns:112px 1fr 54px;gap:8px;align-items:center;padding:4px 0;border-bottom:1px solid var(--b);font-size:11.5px}
.sp .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp .pc{text-align:right;font-variant-numeric:tabular-nums;font-size:11px}
.lg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;margin-top:6px}
.lg .sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.lg b{font-weight:400;color:var(--mut);margin-left:4px}
.tabs{display:flex;border-top:1px solid var(--b2);position:sticky;bottom:0;background:var(--bg)}
.tabs div{flex:1;text-align:center;padding:8px 0 10px;font-size:12px;color:var(--mut);cursor:pointer}
.tabs div b{display:block;font-size:20px;font-weight:400;margin-bottom:1px}
.tabs div.on{color:var(--p)}
.dots{display:flex;justify-content:center;gap:9px;margin:14px 0 6px}
.dot{width:12px;height:12px;border-radius:50%;border:1px solid var(--b2)}
.dot.on{background:var(--tx);border-color:var(--tx)}
.pad{display:grid;grid-template-columns:repeat(3,68px);gap:10px;justify-content:center;margin:16px 0 8px}
.pad button{height:50px;font-size:20px;padding:0;background:var(--bg2);color:var(--tx);border:1px solid var(--b)}
.stg{padding:10px 0;border-bottom:1px solid var(--b);display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
.pl{list-style:none;margin:0;padding:0}
.pl li{padding:11px 6px;border-bottom:1px solid var(--b);cursor:pointer}
.foot{font-size:11px;color:var(--mut);margin:12px 2px 2px}
.warn{font-size:12px;color:var(--dn);margin:6px 2px}
</style></head><body>
<div id="ph"></div>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.39.0/lib/msal-browser.min.js"></script>
<script>
/*PURE-START*/
const parseNum=t=>{
  if(typeof t==="number")return t;
  if(t==null)return 0;
  let s=String(t).replace(/[€%\s\u00a0]/g,"").replace(/[−–]/g,"-");
  if(!s)return 0;
  const c=s.includes(","),d=s.includes(".");
  if(c&&d)s=s.replace(/\./g,"").replace(",",".");
  else if(c)s=s.replace(",",".");
  else if(d&&/^-?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,"");
  const n=parseFloat(s);return isNaN(n)?0:n;
};
function parseList(v){
  if(!v||v.length<2)throw new Error("Geen gegevens gevonden in het tabblad met aandelen");
  const h=v[0].map(x=>String(x).toLowerCase());
  const find=(...k)=>h.findIndex(x=>k.some(y=>x.includes(y)));
  const iS=find("symbool","ticker","symbol"),iQ=find("aantal","stuks","quantity");
  const iP=find("totaal","betaald","aankoopwaarde");
  const iB=h.findIndex(x=>(x.includes("koers")||x.includes("prijs"))&&!x.includes("totaal")&&!x.includes("waarde"));
  if(iS<0||iQ<0)throw new Error("Kolommen 'Symbool' en 'Aantal' niet gevonden in de eerste rij van het tabblad met aandelen");
  const m={};
  v.slice(1).forEach(r=>{
    const sym=String(r[iS]==null?"":r[iS]).trim().toUpperCase();if(!sym)return;
    const q=parseNum(r[iQ]),o=m[sym]||(m[sym]={sym,qty:0,paid:0,bq:0});
    o.qty+=q;if(iP>=0)o.paid+=parseNum(r[iP]);if(iB>=0)o.bq+=parseNum(r[iB])*q;
  });
  return Object.values(m).filter(o=>o.qty>0).map(o=>({sym:o.sym,qty:o.qty,paid:o.paid,buy:o.qty&&o.bq?o.bq/o.qty:0}));
}
function fmtT(raw,kind){
  const s=String(raw==null?"":raw).trim();
  if(!s)return "";
  if(/[€%]/.test(s))return s;
  if(!/^[-−]?[\d.,]+$/.test(s))return s;
  const n=parseNum(s);
  const nf=(x,d)=>Math.abs(x).toLocaleString("nl-BE",{minimumFractionDigits:d,maximumFractionDigits:d});
  return kind==="p"?(n<0?"−":"")+nf(n*100,2)+"%":(n<0?"−":"")+"€ "+nf(n,2);
}
function parseTarget(t){
  const T=t.map(r=>r.map(c=>String(c==null?"":c).replace(/\s+/g," ").trim()));
  const hi=T.findIndex(r=>r.filter(c=>c).length>=3);
  if(hi<0)throw new Error("Geen kopregel met de scenario's gevonden in het tabblad met targets");
  const H=T[hi];
  let end=H.findIndex((c,i)=>i>0&&/^behaald/i.test(c));
  if(end<0)end=H.length;
  const sc=[];H.forEach((c,i)=>{if(i>0&&i<end&&c)sc.push(i)});
  if(!sc.length)throw new Error("Geen scenario-kolommen gevonden in het tabblad met targets");
  const last=sc[sc.length-1];
  const names=sc.map(i=>H[i]);
  const extraLabel=H.slice(end).find(x=>x)||"Behaald";
  const subRow=T[hi+1]||[];
  let ex=[];subRow.forEach((c,i)=>{if(i>last&&c)ex.push([i,/%/.test(c)?"p":"e"])});
  if(!ex.length){const w=Math.max(0,...T.slice(hi+1).map(r=>r.length));for(let i=last+1;i<w;i++)ex.push([i,ex.length?"p":"e"])}
  const isPct=l=>/^noodz|rend\b|budget gehaald|verlopen dagen|%/i.test(l);
  const rows=[];let gap=false,bad=0;
  for(let r=hi+1;r<T.length;r++){
    const row=T[r];
    row.forEach(c=>{if(/^#(BLOCKED|REF|NAME|VALUE|N\/A|DIV)/i.test(c))bad++});
    let label=row.slice(0,sc[0]).filter(x=>x).join(" ");
    const raw=sc.map(i=>row[i]||"");
    let extra=ex.map(([ci,k])=>fmtT(row[ci],k)).filter(x=>x);
    if(!label&&raw.every(x=>!x)&&!extra.length){gap=true;continue}
    if(!label&&rows.length===0){label="Jaartarget";extra=[]}
    const kind=isPct(label)?"p":"e";
    rows.push({label,vals:raw.map(v=>fmtT(v,kind)),extra,gap:gap&&rows.length>0});gap=false;
  }
  return{names,extraLabel,rows,warn:bad?bad+" cellen konden niet gelezen worden":""};
}
function targetCharts(P){
  const bud=[],ver=[],sch=[];let cur="";
  P.rows.forEach(r=>{
    const m=r.label.match(/^(\d+)\s*jaar/i);if(m)cur=m[1]+" jaar";
    const l=r.label.toLowerCase();
    if(l.includes("budget gehaald"))bud.push({cur,vals:r.vals.map(parseNum)});
    else if(l.includes("verlopen dagen"))ver.push({cur,vals:r.vals.map(parseNum)});
    else if(/voor\s*\/\s*achter/.test(l))sch.push({cur,vals:r.vals.map(parseNum)});
  });
  return{
    prog:bud.map((b,i)=>({title:"Voortgang "+b.cur,vals:b.vals,mark:ver[i]?ver[i].vals[0]:null})),
    schema:sch.map(s=>({title:"Voor / achter op schema"+(s.cur?", "+s.cur:""),vals:s.vals}))
  };
}
/*PURE-END*/

const TITLE="Wouter's aandelenscreener";
const CLIENT_ID="2b2a7bff-3f04-4eee-9e5f-57138ea6d683";
const SCOPES=["Files.Read","User.Read"];
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let S={proxy:"",pos:[],file:null,tgt:null,showVal:true,collapsed:{},hist:{},lock:null,fails:0,until:0};
try{Object.assign(S,JSON.parse(localStorage.getItem("aand")||"{}"))}catch(e){}
S.collapsed=S.collapsed||{};S.hist=S.hist||{};if(S.showVal===undefined)S.showVal=true;
const save=()=>{try{localStorage.setItem("aand",JSON.stringify(S))}catch(e){}};
const U={scr:S.lock?"lock":(S.proxy&&S.file&&S.file.sheet?"app":"settings"),tab:0,view:0,sc:0,dm:"a",gm:"e",per:1,wp:1,code:[],step:0,tmp:"",msg:"",ps:null,syMsg:"",stMsg:"",cfgMsg:""};
let Q={},FXQ={},HIST={},busy=false,fxMiss=false,account=null,hiddenAt=0;
const app=new msal.PublicClientApplication({auth:{clientId:CLIENT_ID,authority:"https://login.microsoftonline.com/common",redirectUri:location.origin+location.pathname},cache:{cacheLocation:"localStorage"}});

/* ---------- opmaak ---------- */
const cl=n=>n>=0?"up":"dn";
const nm=(n,d)=>Math.abs(n).toLocaleString("nl-BE",{minimumFractionDigits:d,maximumFractionDigits:d});
const sg=(n,d)=>(n>0?"+":n<0?"−":"")+nm(n,d);
const pc=n=>sg(n,2)+"%";
const ec=(n,d)=>(n>0?"+":n<0?"−":"")+"€"+nm(n,d);
const es=(n,d)=>(n>0?"+":n<0?"−":"")+"€ "+nm(n,d);
const ev=n=>"€"+nm(n,0);
const eur=n=>"€ "+nm(n,0);
const sum=(l,f)=>l.reduce((a,x)=>a+f(x),0);
const hhmm=()=>new Date().toLocaleTimeString("nl-BE",{hour:"2-digit",minute:"2-digit"});

/* ---------- OneDrive ---------- */
async function token(interactive){
  try{return (await app.acquireTokenSilent({scopes:SCOPES,account})).accessToken}
  catch(e){if(interactive)await app.acquireTokenRedirect({scopes:SCOPES});throw new Error("Opnieuw inloggen nodig (ga naar Instellingen)")}
}
async function g(url,interactive){
  const r=await fetch("https://graph.microsoft.com/v1.0"+url,{headers:{Authorization:"Bearer "+await token(interactive)}});
  if(!r.ok){
    const t=await r.text();
    if(t.includes("PasswordProtected"))throw new Error("Het Excel-bestand is met een wachtwoord beveiligd. Gebruik een bestand zonder wachtwoord.");
    throw new Error("OneDrive "+r.status+": "+t.slice(0,120));
  }
  return r.json();
}
async function syncExcel(interactive){
  if(!S.file||!S.file.sheet){U.syMsg="Kies eerst een bestand en tabbladen bij Instellingen.";draw();return false}
  if(!account){if(interactive)await app.loginRedirect({scopes:SCOPES});U.syMsg="Log eerst in bij Instellingen.";draw();return false}
  U.syMsg="Lijst ophalen…";draw();
  const base=`/me/drive/items/${S.file.id}/workbook/worksheets/`;
  let msg="";
  try{
    const d=await g(base+encodeURIComponent(S.file.sheet)+"/usedRange?$select=values",interactive);
    S.pos=parseList(d.values);save();msg=S.pos.length+" aandelen";
  }catch(e){U.syMsg=e.message;draw();return false}
  if(S.file.tsheet){
    try{
      const t=await g(base+encodeURIComponent(S.file.tsheet)+"/usedRange?$select=text",interactive);
      S.tgt=parseTarget(t.text);save();msg+=" en targets"+(S.tgt.warn?" ("+S.tgt.warn+")":"");
    }catch(e){msg+=" · targets: "+e.message}
  }
  U.syMsg=msg+" uit Excel, "+hhmm();draw();return true;
}

/* ---------- Koersen ---------- */
async function yq(sym,range){
  const r=await fetch(S.proxy.replace(/\/+$/,"")+"/?s="+encodeURIComponent(sym)+(range?"&r="+range:""));
  if(!r.ok)throw new Error(r.status===404?"Symbool niet gevonden":"Fout "+r.status);
  const j=await r.json(),res=j.chart&&j.chart.result&&j.chart.result[0];
  if(!res)throw new Error("Symbool niet gevonden");
  const m=res.meta,ts=res.timestamp||[],cl2=((res.indicators.quote||[])[0]||{}).close||[];
  const bars=ts.map((t,i)=>[t,cl2[i]]).filter(b=>b[1]!=null);
  let prev=m.chartPreviousClose;
  if(bars.length){
    const last=bars[bars.length-1][0];
    const same=new Date(last*1000).toDateString()===new Date((m.regularMarketTime||last)*1000).toDateString();
    const p=same?bars[bars.length-2]:bars[bars.length-1];
    if(p)prev=p[1];
  }
  return{c:m.regularMarketPrice,prev,cur:m.currency,name:m.shortName||m.longName||sym,closes:bars.map(b=>b[1])};
}
function recordHist(){
  const its=items();
  if(!its.length||its.some(i=>i.v==null))return;
  const day=new Date().toLocaleDateString("sv-SE");
  S.hist[day]=Math.round(sum(its,i=>i.v));save();
}
async function refresh(){
  if(busy||U.scr==="lock"||U.scr==="setup")return;
  if(!S.proxy){U.stMsg="Vul eerst het adres van je koersen-doorgever in bij Instellingen.";draw();return}
  if(!S.pos.length){draw();return}
  busy=true;U.stMsg="Bijwerken…";draw();
  await Promise.all(S.pos.map(async p=>{try{const x=await yq(p.sym);Q[p.sym]=x;HIST[p.sym+"|5d"]=x.closes}catch(e){Q[p.sym]={err:e.message||"Geen verbinding"}}}));
  const curs=[...new Set(S.pos.map(p=>Q[p.sym]).filter(q=>q&&q.cur&&q.cur!=="EUR").map(q=>q.cur))];
  await Promise.all(curs.map(async c=>{try{const x=await yq("EUR"+c+"=X");FXQ[c]={now:x.c,prev:x.prev}}catch(e){}}));
  busy=false;U.stMsg="Koersen bijgewerkt om "+hhmm();
  recordHist();draw();
}
const RG=["5d","1mo","1y"];
async function loadHist(){
  const rg=RG[U.per];if(rg==="5d"||!S.proxy)return;
  await Promise.all(S.pos.filter(p=>!HIST[p.sym+"|"+rg]).map(async p=>{try{HIST[p.sym+"|"+rg]=(await yq(p.sym,rg)).closes}catch(e){HIST[p.sym+"|"+rg]=[]}}));
  draw();
}
async function startUp(){
  if(account&&S.file&&S.file.sheet)await syncExcel(false);
  await refresh();
  if(U.tab===0&&U.view===1)loadHist();
}

/* ---------- berekeningen ---------- */
function items(){
  fxMiss=false;
  return S.pos.map(p=>{
    const q=Q[p.sym],it={p,k:p.sym,nm:(q&&q.name)||p.sym,cur:"",sub:"",v:null,d:null,pct:null,g:null,gp:null};
    if(!q)it.sub="…";
    else if(q.err)it.sub=q.err;
    else{
      it.cur=q.cur||"";
      const fx=q.cur==="EUR"?{now:1,prev:1}:FXQ[q.cur];
      if(!fx){fxMiss=true;it.sub="wisselkoers niet beschikbaar"}
      else{
        it.v=q.c*p.qty/fx.now;const pe=q.prev*p.qty/fx.prev;it.d=it.v-pe;
        it.pct=q.prev?((q.c/fx.now)/(q.prev/fx.prev)-1)*100:0;
        if(p.paid>0){it.g=it.v-p.paid;it.gp=it.g/p.paid*100}
      }
    }
    return it;
  });
}
function agg(l){
  const ok=l.filter(i=>i.v!=null),sd=sum(ok,i=>i.d),sv=sum(ok,i=>i.v),gg=ok.filter(i=>i.g!=null);
  return{ok,sd,sv,stt:sum(gg,i=>i.g),cost:sum(gg,i=>i.p.paid),hasG:gg.length>0,sp:(sv-sd)?sd/(sv-sd)*100:0};
}
function groups(its){
  const m={};its.forEach(i=>(m[i.cur]=m[i.cur]||[]).push(i));
  return Object.keys(m).sort((a,b)=>a===""?1:b===""?-1:a.localeCompare(b)).map(k=>Object.assign({k,l:m[k]},agg(m[k])));
}

/* ---------- onderdelen ---------- */
function seg(a,opts,cur){return '<div class="seg">'+opts.map(o=>`<button data-a="${a}" data-v="${o[0]}" class="${String(cur)===String(o[0])?"on":""}">${o[1]}</button>`).join("")+"</div>"}
function diverge(rows,fn){
  const m=Math.max(...rows.map(r=>Math.abs(r[1])),0.0001);
  return rows.map(r=>{
    const w=Math.abs(r[1])/m*50,pos=r[1]>=0,s=pos?`left:50%;width:${w}%`:`left:${50-w}%;width:${w}%`;
    return `<div class="dv"><div class="nm">${esc(r[0])}</div><div class="ar"><div class="bar ${pos?"bu":"bd"}" style="${s}"></div></div><div class="vl ${cl(r[1])}">${fn(r[1])}</div></div>`;
  }).join("");
}
function prog(rows,mark){

const COL=["#3B82F6","#F59E0B","#10B981","#8B5CF6","#EF4444","#06B6D4","#9CA3AF"];
function donutH(its){

  else{const m={};ok.forEach(i=>m[i.cur]=(m[i.cur]||0)+i.v);rows=Object.keys(m).sort().map(k=>[k,m[k]])}

  const lg=rows.map((r,i)=>`<div><span class="sw" style="background:${(U.dm==="a"&&i===6)?COL[6]:COL[i%6]}"></span>${esc(r[0])}<b>${Math.round(r[1]/tot*100)}%</b></div>`).join("");

async function hashCode(c,salt){
  const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(salt+":"+c));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
}
async function key(v){
  if(U.scr==="lock"&&Date.now()<S.until)return;
  U.code.push(v);
  if(U.code.length<9){render();return}
  const c=U.code.join("");U.code=[];
  try{
    if(U.scr==="lock"){
      if(await hashCode(c,S.lock.salt)===S.lock.hash){S.fails=0;S.until=0;save();U.msg="";U.scr="app";render();startUp();return}
      S.fails++;const wait=S.fails>=5?30*Math.pow(2,Math.min(S.fails-5,6)):0;
      S.until=wait?Date.now()+wait*1000:0;save();
      U.msg=wait?"Te veel pogingen. Wacht "+wait+" seconden.":"Onjuiste code.";render();return;
    }
    if(U.scr==="setup"){
      if(U.step===0){U.tmp=c;U.step=1;U.msg="";render();return}
      if(c!==U.tmp){U.step=0;U.tmp="";U.msg="De codes waren verschillend. Probeer opnieuw.";render();return}
      const salt=[...crypto.getRandomValues(new Uint8Array(16))].map(x=>x.toString(16).padStart(2,"0")).join("");
      S.lock={salt,hash:await hashCode(c,salt),after:S.lock?S.lock.after:60};S.fails=0;S.until=0;save();
      U.tmp="";U.msg="";U.scr="settings";render();
    }
  }catch(e){U.msg="Code instellen lukt niet in deze browser.";U.step=0;render()}
}

/* ---------- acties ---------- */
const root=$("ph");
root.addEventListener("click",e=>{
  const t=e.target.closest("[data-a]");if(!t)return;
  const a=t.getAttribute("data-a"),v=t.getAttribute("data-v");
  if(a==="sv"||a==="la")return;
  if(a==="key"){key(v);return}
  if(a==="del"){U.code.pop();render();return}
  if(a==="cancel"){U.scr="settings";U.step=0;U.tmp="";U.code=[];U.msg="";render();return}
  if(a==="tab"){U.tab=+v}
  else if(a==="view"){U.view=+v;if(U.tab===0&&U.view===1)loadHist()}
  else if(a==="sc")U.sc=+v;
  else if(a==="grp")S.collapsed[v]=!S.collapsed[v];
  else if(a==="dm")U.dm=v;
  else if(a==="gm")U.gm=v;
  else if(a==="per"){U.per=+v;loadHist()}
  else if(a==="wp")U.wp=+v;
  else if(a==="refresh"){refresh();return}
  else if(a==="sync"){syncExcel(true).then(ok=>{if(ok)refresh()});return}
  else if(a==="cfg")U.scr="settings";
  else if(a==="back"){U.scr="app";render();refresh();return}
  else if(a==="sp"){S.proxy=$("proxy").value.trim();save();Q={};FXQ={};HIST={};U.cfgMsg="Opgeslagen.";render();return}
  else if(a==="login"){app.loginRedirect({scopes:SCOPES});return}
  else if(a==="pf"){pStart();return}
  else if(a==="pts"){pSheets("aandelen",false);return}
  else if(a==="ptt"){pSheets("targets",false);return}
  else if(a==="pback"){U.scr="settings"}
  else if(a==="pup"){U.ps.stack.pop();pFolder();return}
  else if(a==="pi"){
    const ps=U.ps,i=+v;
    if(ps.mode==="file"){
      const x=ps.items[i];
      if(x.folder){ps.stack.push({id:x.id,name:x.name});pFolder()}
      else{S.file={id:x.id,name:x.name,sheet:"",tsheet:""};save();pSheets("aandelen",true)}
      return;
    }
    const name=ps.items[i];
    if(ps.which==="aandelen"){S.file.sheet=name;save();if(ps.chain)pSheets("targets",true);else{U.scr="settings";render()}}
    else{S.file.tsheet=name;save();pFinish(ps.chain)}
    return;
  }
  else if(a==="psk"){S.file.tsheet="";S.tgt=null;save();pFinish(U.ps.chain);return}
  else if(a==="cs"){U.scr="setup";U.step=0;U.tmp="";U.code=[];U.msg="";}
  else if(a==="cx"){if(confirm("Toegangscode uitzetten?")){S.lock=null;S.fails=0;S.until=0}}
  else if(a==="wipe"){if(confirm("Alle bewaarde gegevens wissen? Dit kan niet ongedaan worden gemaakt.")){try{localStorage.clear()}catch(x){}location.reload()}return}
  save();render();
});
root.addEventListener("change",e=>{
  const a=e.target.getAttribute("data-a");
  if(a==="sv"){S.showVal=e.target.checked;save();render()}
  else if(a==="la"&&S.lock){S.lock.after=+e.target.value;save()}
});
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){hiddenAt=Date.now();return}
  if(S.lock&&U.scr!=="lock"&&U.scr!=="setup"&&(Date.now()-hiddenAt)/1000>=S.lock.after){U.scr="lock";U.code=[];U.msg="";render();return}
  if(U.scr==="app")refresh();
});
setInterval(()=>{if(!document.hidden&&U.scr==="app")refresh()},60000);
setInterval(()=>{
  if(U.scr!=="lock")return;
  if(S.until>Date.now()){U.msg="Wacht "+Math.ceil((S.until-Date.now())/1000)+" seconden";render()}
  else if(U.msg.startsWith("Wacht")||U.msg.startsWith("Te veel")){U.msg="";render()}
},1000);
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");

(async()=>{
  try{const r=await app.handleRedirectPromise();account=(r&&r.account)||app.getAllAccounts()[0]||null}catch(e){U.syMsg=e.message}
  render();
  if(U.scr==="app")startUp();
})();
</script></body></html>
