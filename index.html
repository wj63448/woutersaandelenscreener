const parseDate=t=>{

  try{
    if(U.scr==="lock"){
      if(await hashCode(c,S.lock.salt)===S.lock.hash){S.fails=0;S.until=0;save();U.msg="";U.scr="app";render();startUp();return}
      S.fails++;const wait=S.fails>=5?30*Math.pow(2,Math.min(S.fails-5,6)):0;
      S.until=wait?Date.now()+wait*1000:0;save();
      U.msg=wait?"Te veel pogingen. Wacht "+wait+" seconden.":"Onjuiste code.";render();return;
    }
    if(U.scr==="setup"){
      if(U.step===0){U.tmp=c;U.step=1;U.msg="";render();return}
      if(c!==U.tmp){U.step=0;U.tmp="";U.msg="De codes waren verschillend. Probeer opnieuw.";render();return}
      const salt=[...crypto.getRandomValues(new Uint8Array(16))].map(x=>x.toString(16).padStart(2,"0")).join("");
      S.lock={salt,hash:await hashCode(c,salt),after:S.lock?S.lock.after:60};S.fails=0;S.until=0;save();
      U.tmp="";U.msg="";U.scr="settings";render();
    }
  }catch(e){U.msg="Code instellen lukt niet in deze browser.";U.step=0;render()}
}

/* ---------- acties ---------- */
const root=$("ph");
root.addEventListener("click",e=>{
  const t=e.target.closest("[data-a]");if(!t)return;
  const a=t.getAttribute("data-a"),v=t.getAttribute("data-v");
  if(a==="sv"||a==="swp"||a==="la"||a==="rate"||a==="meth")return;
  if(a==="bio"){bioUnlock(true);return}
  if(a==="key"){key(v);return}
  if(a==="del"){U.code.pop();render();return}
  if(a==="cancel"){U.scr="settings";U.step=0;U.tmp="";U.code=[];U.msg="";render();return}
  if(a==="tab"){U.tab=+v;if(U.tab!==0&&U.view===2)U.view=0}
  else if(a==="view"){U.view=+v;if(U.tab===0&&U.view===1){loadHist();loadIdx()}if(U.tab===0&&U.view===2)loadVix()}
  else if(a==="sc")U.sc=+v;
  else if(a==="grp")S.collapsed[v]=!S.collapsed[v];
  else if(a==="dm")U.dm=v;
  else if(a==="gm")U.gm=v;
  else if(a==="per"){U.per=+v;loadHist()}
  else if(a==="wp")U.wp=+v;
  else if(a==="ip")U.ip=+v;
  else if(a==="vm")U.vm=v;
  else if(a==="sall")U.sall=!U.sall;
  else if(a==="optgo")U.tab=3;
  else if(a==="vtap"){U.vt=(U.vt||0)+1;if(U.vt>=5){U.vt=0;U.dbg=!U.dbg;showDbg()}}
  else if(a==="optjump"){U.tab=3;U.os=v;U.view=0;setTimeout(()=>window.scrollTo(0,0),0)}
  else if(a==="os")U.os=v;
  else if(a==="vp")U.vp=+v;
  else if(a==="t3"){U.t3o=U.t3o||{};U.t3o[v]=!U.t3o[v]}
  else if(a==="sg"){S.sopen=S.sopen||{};S.sopen[v]=!S.sopen[v];save()}
  else if(a==="ig"){S.iopen=S.iopen||{};S.iopen[v]=!S.iopen[v];save()}
  else if(a==="tm"){S.totMode=S.totMode==="p"?"e":"p";save()}
  else if(a==="ix"){S.idxOn=S.idxOn.includes(v)?S.idxOn.filter(x=>x!==v):S.idxOn.concat(v);save();loadIdx()}
  else if(a==="refresh"){refresh();return}
  else if(a==="sync"){syncExcel(true).then(ok=>{if(ok)refresh()});return}
  else if(a==="cfg")U.scr="settings";
  else if(a==="back"){U.scr="app";render();refresh();return}
  else if(a==="sp"){S.proxy=$("proxy").value.trim();S.pkey=$("pkey").value.trim();save();UQ={};VXD=undefined;Q={};FXQ={};HIST={};IXD={};U.cfgMsg="Opgeslagen.";render();return}
  else if(a==="login"){doLogin();return}
  else if(a==="pf"){pStart();return}
  else if(a==="pts"){pSheets("aandelen",false);return}
  else if(a==="ptt"){pSheets("targets",false);return}
  else if(a==="pback"){U.scr="settings"}
  else if(a==="pup"){U.ps.stack.pop();pFolder();return}
  else if(a==="pi"){
    const ps=U.ps,i=+v;
    if(ps.mode==="file"){
      const x=ps.items[i];
      if(x.folder){ps.stack.push({id:x.id,name:x.name});pFolder()}
      else{S.file={id:x.id,name:x.name,sheet:"",tsheet:""};save();pSheets("aandelen",true)}
      return;
    }
    const name=ps.items[i];
    if(ps.which==="aandelen"){S.file.sheet=name;save();if(ps.chain)pSheets("targets",true);else{U.scr="settings";render()}}
    else{S.file.tsheet=name;save();pFinish(ps.chain)}
    return;
  }
  else if(a==="psk"){S.file.tsheet="";S.tgt=null;save();pFinish(U.ps.chain);return}
  else if(a==="cs"){U.scr="setup";U.step=0;U.tmp="";U.code=[];U.msg="";}
  else if(a==="cx"){if(confirm("Toegangscode uitzetten?")){S.lock=null;S.bio=null;S.fails=0;S.until=0}}
  else if(a==="wipe"){if(confirm("Alle bewaarde gegevens wissen? Dit kan niet ongedaan worden gemaakt.")){try{localStorage.clear()}catch(x){}location.reload()}return}
  save();render();
});
root.addEventListener("change",e=>{
  const a=e.target.getAttribute("data-a");
  if(a==="sv"){S.showVal=e.target.checked;save();render()}
  else if(a==="swp"){S.swp=e.target.checked;save();render()}
  else if(a==="la"&&S.lock){S.lock.after=+e.target.value;save()}
  else if(a==="meth"){
    if(e.target.value==="bio"){U.secMsg="Bevestig met je vingerafdruk…";render();bioReg().then(()=>{U.secMsg="Vingerafdruk ingesteld. Je code blijft de reserve.";render()}).catch(()=>{S.bio=null;save();U.secMsg="Instellen met vingerafdruk is niet gelukt. Je gebruikt de code.";render()})}
    else{S.bio=null;save();U.secMsg="Je ontgrendelt nu met je code.";render()}
  }
  else if(a==="rate"){S.rate=+e.target.value;save();setRate()}
});
/* ---------- terugknop: zelfde aanpak als de boodschappen-app ----------
   Browsers slaan geschiedenis over die zonder tik werd toegevoegd. Daarom komt er per scherm-niveau
   precies één stap bij, vlak na een tik; de terugknop haalt dan één niveau weg. Op het hoofdscherm
   vangt één extra stap de eerste terug op (melding), de tweede sluit de app. */
let histDepth=0,ignorePops=0,rootGuard=false;const dbg=[];
const cfgOK=()=>!!(S.proxy&&S.file&&S.file.sheet);
function dlog(t){dbg.push(new Date().toLocaleTimeString("nl-BE")+" "+t+" · len "+history.length+" · diepte "+histDepth+(rootGuard?" · wacht":""));if(dbg.length>12)dbg.shift();if(U.dbg)showDbg()}
function showDbg(){let el=$("dbg");if(!U.dbg){if(el)el.remove();return}
  if(!el){el=document.createElement("div");el.id="dbg";el.style.cssText="position:fixed;left:8px;right:8px;top:8px;z-index:95;background:rgba(20,26,22,.92);color:#fff;border-radius:12px;padding:10px 12px;font:11px/1.4 monospace;pointer-events:none";document.body.appendChild(el)}
  let m="browser";try{if(matchMedia("(display-mode: standalone)").matches)m="geïnstalleerde app"}catch(e){}
  el.innerHTML="<b>"+m+" · v"+esc(VER.split(" ")[0])+"</b>"+dbg.map(l=>"<div>"+esc(l)+"</div>").join("")}
let tstT=null;
function toastMsg(t){let el=$("tst");if(!el){el=document.createElement("div");el.id="tst";el.style.cssText="position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(20,24,30,.92);color:#fff;padding:9px 14px;border-radius:18px;font-size:13px;z-index:90;max-width:80%;text-align:center";document.body.appendChild(el)}
  el.textContent=t;el.style.display="block";clearTimeout(tstT);tstT=setTimeout(()=>{el.style.display="none"},3000)}
function navLevel(){
  if(U.scr==="lock")return 0;
  const a=(U.tab!==0?1:0)+(U.tab===0&&U.view!==0?1:0);
  if(U.scr==="app")return a;
  const base=cfgOK()?a+1:0;
  if(U.scr==="settings")return base;
  if(U.scr==="setup")return base+1;
  if(U.scr==="picker")return base+1+((U.ps&&U.ps.mode==="file"&&U.ps.stack)?U.ps.stack.length:0);
  return a;
}
function syncHistory(){
  const level=navLevel();
  try{
    if(level>histDepth&&!rootGuard&&histDepth===0)ensureRootGuard();
    if(level>histDepth){
      for(let i=histDepth;i<level;i++)history.pushState({app:"nav"},"");
      histDepth=level;
      dlog("stap(pen) toegevoegd → niveau "+level+(navigator.userActivation?" · tik "+navigator.userActivation.isActive:""));
    }else if(level<histDepth){
      const n=histDepth-level;histDepth=level;ignorePops++;history.go(-n);dlog(n+" stap(pen) terug via app");
    }
  }catch(e){}
}
function stepBack(){
  if(U.scr==="setup"){U.scr="settings";U.step=0;U.tmp="";U.code=[];U.msg="";return}
  if(U.scr==="picker"){if(U.ps&&U.ps.mode==="file"&&U.ps.stack.length){U.ps.stack.pop();pFolder();return}U.scr="settings";return}
  if(U.scr==="settings"){U.scr="app";setTimeout(refresh,0);return}
  if(U.tab!==0){U.tab=0;U.view=0;window.scrollTo(0,0);return}
  if(U.view!==0)U.view=0;
}
function ensureRootGuard(){
  if(rootGuard||histDepth!==0||U.scr==="lock")return;
  if(navigator.userActivation&&!navigator.userActivation.isActive){dlog("wachtstap overgeslagen: geen tik");return}
  try{history.pushState({app:"root"},"");rootGuard=true;dlog("wachtstap toegevoegd")}catch(e){dlog("fout "+e.message)}
}
["click","touchend","keydown"].forEach(ev=>document.addEventListener(ev,ensureRootGuard,true));
addEventListener("popstate",()=>{
  dlog("TERUG ontvangen");
  if(ignorePops>0){ignorePops--;return}
  if(histDepth>0){histDepth--;stepBack();render();return}
  if(rootGuard){rootGuard=false;toastMsg("Druk nog eens op terug om de app te sluiten")}
});
const stamp=()=>{try{if(S.lock&&U.scr!=="lock"&&U.scr!=="setup")sessionStorage.setItem("aandAct",String(Date.now()));else sessionStorage.removeItem("aandAct")}catch(e){}};
addEventListener("pagehide",stamp);
setInterval(()=>{if(!document.hidden)stamp()},5000);
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){hiddenAt=Date.now();stamp();return}
  if(S.lock&&U.scr!=="lock"&&U.scr!=="setup"&&(Date.now()-hiddenAt)/1000>=S.lock.after){U.scr="lock";U.code=[];U.msg="";U.bt=false;render();return}
  if(U.scr==="app")refresh();
});
let rt=null;function setRate(){clearInterval(rt);if(S.rate>0)rt=setInterval(()=>{if(!document.hidden&&U.scr==="app")refresh()},S.rate*1000)}
setRate();
setInterval(()=>{
  if(U.scr!=="lock")return;
  if(S.until>Date.now()){U.msg="Wacht "+Math.ceil((S.until-Date.now())/1000)+" seconden";render()}
  else if(U.msg.startsWith("Wacht")||U.msg.startsWith("Te veel")){U.msg="";render()}
},1000);
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");

(async()=>{
  try{const r=await app.handleRedirectPromise();account=(r&&r.account)||app.getAllAccounts()[0]||null;if(!r&&!/[#?].*(code|error)=/.test(location.hash+location.search))clearStale();if(r&&r.account){U.cfgMsg="Ingelogd als "+(r.account.username||"")}}catch(e){clearStale();U.cfgMsg="Inloggen mislukt: "+(e.errorMessage||e.message);U.syMsg=U.cfgMsg}
  render();
  if(U.scr==="app")startUp();
})();
</script></body></html>
